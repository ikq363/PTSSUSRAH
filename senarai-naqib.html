<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Usrah PTSS - Log Masuk / Daftar Naqib</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .tab-btn.active {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: 600;
        }
        .form-content {
            display: none;
        }
        .form-content.active {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-center text-white">
            <i class="fa-solid fa-users-rectangle text-4xl mb-2"></i>
            <h1 class="text-2xl font-bold">PORTAL NAQIB / NAQIBAH</h1>
            <p class="text-xs text-blue-200 mt-1">Sistem Pengurusan Usrah PTSS</p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-200">
            <button id="tabSignIn" onclick="switchAuthTab('signin')" class="tab-btn active w-1/2 py-3 text-center text-sm text-gray-500 hover:text-blue-600 transition">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Log Masuk
            </button>
            <button id="tabSignUp" onclick="switchAuthTab('signup')" class="tab-btn w-1/2 py-3 text-center text-sm text-gray-500 hover:text-blue-600 transition">
                <i class="fa-solid fa-user-plus mr-1"></i> Daftar Akaun
            </button>
        </div>

        <div class="p-6">
            
            <!-- FORM 1: LOG MASUK -->
            <form id="formSignIn" class="form-content active space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nama Penuh</label>
                    <input type="text" id="loginNama" required class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="Contoh: MUHAMMAD ALI">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">No. Matrik</label>
                    <input type="text" id="loginMatrik" required class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="Contoh: 18DDT21F1001">
                </div>

                <button type="submit" id="btnSignInSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Log Masuk
                </button>
            </form>

            <!-- FORM 2: PENDAFTARAN -->
            <form id="formSignUp" class="form-content space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nama Penuh</label>
                    <input type="text" id="regNama" required class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="Nama mengikut kad pengenalan">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">No. Matrik</label>
                    <input type="text" id="regMatrik" required class="w-full px-4 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="Contoh: 18DDT21F1001">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jabatan</label>
                        <select id="regJabatan" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Pilih Jabatan</option>
                            <option value="JTMK">JTMK</option>
                            <option value="JKE">JKE</option>
                            <option value="JKM">JKM</option>
                            <option value="JP">JP</option>
                            <option value="JRKV">JRKV</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kelas</label>
                        <input type="text" id="regKelas" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none uppercase" placeholder="DDT5A">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Peranan Usrah</label>
                    <select id="regRole" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Naqib">Naqib (Lelaki)</option>
                        <option value="Naqibah">Naqibah (Perempuan)</option>
                    </select>
                </div>

                <button type="submit" id="btnSignUpSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-paper-plane"></i> Hantar Pendaftaran
                </button>
            </form>

        </div>
    </div>

    <!-- FIREBASE SDK v10 (FIRESTORE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase PTSSUSRAH
        const firebaseConfig = {
            apiKey: "AIzaSyDZWnQZou365jx6NtOFAWN_uNkZ3ppRvl0",
            authDomain: "ptssusrah.firebaseapp.com",
            projectId: "ptssusrah",
            storageBucket: "ptssusrah.firebasestorage.app",
            messagingSenderId: "859008504533",
            appId: "1:859008504533:web:51d6ccdbf3b4e090aec85c",
            measurementId: "G-D185J3E844"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Relative path untuk memastikan pautan berfungsi secara lokal & server
        const DASHBOARD_URL = "./dashboard-naqib.html";

        // 1. SEMAKAN SESI (Auto-Redirect jika akaun sudah sedia log masuk)
        (function checkExistingSession() {
            const savedUser = localStorage.getItem('naqibUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    if (user && user.id && user.noMatrik) {
                        window.location.replace(DASHBOARD_URL);
                    }
                } catch (e) {
                    localStorage.removeItem('naqibUser');
                }
            }
        })();

        // Fungsi Helper Timeout
        const withTimeout = (promiseFn, ms = 10000) => {
            return Promise.race([
                promiseFn(),
                new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Masa tamat. Semak rangkaian atau kebenaran Firestore Rules!")), ms)
                )
            ]);
        };

        // Fungsi Tukar Tab Form
        window.switchAuthTab = function(type) {
            const tabSignIn = document.getElementById('tabSignIn');
            const tabSignUp = document.getElementById('tabSignUp');
            const formSignIn = document.getElementById('formSignIn');
            const formSignUp = document.getElementById('formSignUp');

            if (type === 'signin') {
                tabSignIn.classList.add('active');
                tabSignUp.classList.remove('active');
                formSignIn.classList.add('active');
                formSignUp.classList.remove('active');
            } else {
                tabSignUp.classList.add('active');
                tabSignIn.classList.remove('active');
                formSignUp.classList.add('active');
                formSignIn.classList.remove('active');
            }
        };

        // 2. PROSES DAFTAR AKAUN (SIGN UP)
        document.getElementById('formSignUp').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSignUpSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

            const nama = document.getElementById('regNama').value.trim().toUpperCase();
            const noMatrik = document.getElementById('regMatrik').value.trim().toUpperCase();
            const jabatan = document.getElementById('regJabatan').value;
            const kelas = document.getElementById('regKelas').value.trim().toUpperCase();
            const role = document.getElementById('regRole').value;

            try {
                // Semak jika No. Matrik sudah wujud
                const q = query(collection(db, "users"), where("noMatrik", "==", noMatrik));
                const checkSnap = await withTimeout(() => getDocs(q));

                if (!checkSnap.empty) {
                    alert("No. Matrik ini telah berdaftar! Sila log masuk.");
                    switchAuthTab('signin');
                    return;
                }

                // Tambah pengguna baharu ke Firestore
                const docRef = await withTimeout(() => addDoc(collection(db, "users"), {
                    nama: nama,
                    noMatrik: noMatrik,
                    jabatan: jabatan,
                    kelas: kelas,
                    role: role,
                    sesi: "SESI 1 2026/2027",
                    status: "sah",
                    createdAt: serverTimestamp()
                }));

                // Simpan maklumat pengguna ke LocalStorage
                localStorage.setItem('naqibUser', JSON.stringify({
                    id: docRef.id,
                    nama: nama,
                    noMatrik: noMatrik,
                    role: role,
                    jabatan: jabatan,
                    kelas: kelas
                }));

                alert("Pendaftaran berjaya! Mengalih ke Dashboard...");
                window.location.replace(DASHBOARD_URL);

            } catch (error) {
                alert("Gagal mendaftar: " + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Hantar Pendaftaran`;
            }
        });

        // 3. PROSES LOG MASUK (SIGN IN)
        document.getElementById('formSignIn').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSignInSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyemak...`;

            const inputNama = document.getElementById('loginNama').value.trim().toUpperCase();
            const inputMatrik = document.getElementById('loginMatrik').value.trim().toUpperCase();

            try {
                // Cari data pengguna mengikut No. Matrik
                const q = query(collection(db, "users"), where("noMatrik", "==", inputMatrik));
                const querySnapshot = await withTimeout(() => getDocs(q));

                if (querySnapshot.empty) {
                    alert(`Rekod tidak dijumpai bagi No. Matrik: ${inputMatrik}. Sila daftar akaun dahulu.`);
                    switchAuthTab('signup');
                    return;
                }

                let userData = null;
                let userId = null;

                querySnapshot.forEach(docSnap => {
                    userData = docSnap.data();
                    userId = docSnap.id;
                });

                // Simpan ke LocalStorage
                localStorage.setItem('naqibUser', JSON.stringify({
                    id: userId,
                    nama: userData.nama || inputNama,
                    noMatrik: userData.noMatrik,
                    role: userData.role || "Naqib",
                    jabatan: userData.jabatan || "-",
                    kelas: userData.kelas || "-"
                }));

                // Direct ke Dashboard
                window.location.replace(DASHBOARD_URL);

            } catch (error) {
                console.error("Ralat Log Masuk:", error);
                alert("Gagal log masuk: " + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> Log Masuk`;
            }
        });
    </script>
</body>
</html>
