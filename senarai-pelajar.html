<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Pelajar - e-Usrah PTSS</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #d4af37;
            --emerald-green: #059669;
            --bg-dark: #0b1329;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(212, 175, 55, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.92), rgba(6, 78, 59, 0.88)),
                        url('https://images.unsplash.com/photo-1542816417-0983cbe82752?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            background-attachment: fixed;
            color: #ffffff;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(11, 19, 41, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--emerald-green), #047857);
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 22px; color: #fff;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .filter-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* GENDER TABS */
        .gender-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 20px; border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05);
            color: #cbd5e1; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.3s; display: flex; align-items: center; gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--emerald-green), #047857); color: #fff; border-color: transparent;
        }

        /* FILTERS GRID */
        .filter-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;
        }

        .input-group { position: relative; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 11px; color: var(--primary-gold); font-weight: 600; text-transform: uppercase; }

        .form-control {
            width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff;
            font-size: 13px; outline: none; text-transform: uppercase;
        }

        select.form-control option { background: #0f172a; color: #fff; }

        /* AUTO SUGGESTION BOX */
        .suggestions-box {
            position: absolute; top: 100%; left: 0; right: 0; background: #0f172a;
            border: 1px solid var(--border-glass); border-radius: 10px; max-height: 180px;
            overflow-y: auto; z-index: 50; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 10px 14px; cursor: pointer; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .suggestion-item:hover { background: rgba(212, 175, 55, 0.2); }

        /* TABLE STYLES */
        .table-card {
            background: var(--card-glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); border-radius: 20px; overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: rgba(5, 150, 105, 0.3); color: var(--primary-gold); padding: 14px; font-weight: 600; text-transform: uppercase; }
        td { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tr:hover { background: rgba(255, 255, 255, 0.03); }

        .badge-jantina {
            padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block;
        }
        .bg-lelaki { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .bg-perempuan { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid #ec4899; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-users-viewfinder"></i></div>
            <div>
                <h2 style="font-size: 18px;">Senarai Pelajar Berdaftar</h2>
                <p style="font-size: 11px; color: var(--primary-gold);">e-Usrah PTSS</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filter-card">
            <!-- TAB JANTINA -->
            <div class="gender-tabs">
                <button class="tab-btn active" onclick="setGenderFilter('SEMUA', this)"><i class="fa-solid fa-users"></i> Semua Pelajar</button>
                <button class="tab-btn" onclick="setGenderFilter('LELAKI', this)"><i class="fa-solid fa-mars"></i> Pelajar Lelaki</button>
                <button class="tab-btn" onclick="setGenderFilter('PEREMPUAN', this)"><i class="fa-solid fa-venus"></i> Pelajar Perempuan</button>
            </div>

            <!-- FILTERS GRID -->
            <div class="filter-grid">
                <!-- CARIAN AUTOMATIK -->
                <div class="input-group">
                    <label>Cari Nama / No. Matrik</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Mula menaip..." autocomplete="off">
                    <div id="suggestions" class="suggestions-box"></div>
                </div>

                <!-- JABATAN -->
                <div class="input-group">
                    <label>Jabatan</label>
                    <select id="filterJabatan" class="form-control" onchange="applyFilters()">
                        <option value="SEMUA">-- SEMUA JABATAN --</option>
                        <option value="JTMK">JTMK</option>
                        <option value="JKE">JKE</option>
                        <option value="JKM">JKM</option>
                        <option value="JP">JP</option>
                        <option value="JPH">JPH</option>
                    </select>
                </div>

                <!-- KELAS -->
                <div class="input-group">
                    <label>Kelas</label>
                    <select id="filterKelas" class="form-control" onchange="applyFilters()">
                        <option value="SEMUA">-- SEMUA KELAS --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- JADUAL SENARAI PELAJAR -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama Penuh</th>
                        <th>No. Matrik</th>
                        <th>Jabatan</th>
                        <th>Kelas</th>
                        <th>Jantina</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Memuatkan data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ✅ KONFIGURASI FIREBASE SEBENAR ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyDZWnQZou365jx6NtOFAWN_uNkZ3ppRvl0",
            authDomain: "ptssusrah.firebaseapp.com",
            projectId: "ptssusrah",
            storageBucket: "ptssusrah.firebasestorage.app",
            messagingSenderId: "859008504533",
            appId: "1:859008504533:web:51d6ccdbf3b4e090aec85c",
            measurementId: "G-D185J3E844"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allStudents = [];
        let currentGender = "SEMUA";

        async function loadStudents() {
            try {
                const querySnapshot = await getDocs(collection(db, "pelajar"));
                allStudents = [];
                const kelasSet = new Set();

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    allStudents.push(data);
                    if (data.kelas) kelasSet.add(data.kelas.toUpperCase());
                });

                populateKelasDropdown(Array.from(kelasSet).sort());
                applyFilters();

            } catch (error) {
                console.error("Ralat memuatkan data:", error);
            }
        }

        function populateKelasDropdown(kelasList) {
            const select = document.getElementById('filterKelas');
            select.innerHTML = '<option value="SEMUA">-- SEMUA KELAS --</option>';
            kelasList.forEach(k => {
                select.innerHTML += `<option value="${k}">${k}</option>`;
            });
        }

        window.setGenderFilter = function(gender, btnElement) {
            currentGender = gender;
            document.querySelectorAll('.gender-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilters();
        };

        window.applyFilters = function() {
            const searchVal = document.getElementById('searchInput').value.trim().toUpperCase();
            const jabatanVal = document.getElementById('filterJabatan').value;
            const kelasVal = document.getElementById('filterKelas').value;

            const filtered = allStudents.filter(student => {
                const matchGender = currentGender === "SEMUA" || student.jantina === currentGender;
                const matchJabatan = jabatanVal === "SEMUA" || student.jabatan === jabatanVal;
                const matchKelas = kelasVal === "SEMUA" || student.kelas === kelasVal;
                const matchSearch = !searchVal || 
                    student.nama.includes(searchVal) || 
                    student.noMatrik.includes(searchVal);

                return matchGender && matchJabatan && matchKelas && matchSearch;
            });

            renderTable(filtered);
        };

        function renderTable(data) {
            const tbody = document.getElementById('studentTableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #94a3b8;">Tiada rekod pelajar dijumpai.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-weight: 600; color: var(--primary-gold);">${item.nama}</td>
                    <td>${item.noMatrik}</td>
                    <td>${item.jabatan}</td>
                    <td>${item.kelas}</td>
                    <td>
                        <span class="badge-jantina ${item.jantina === 'LELAKI' ? 'bg-lelaki' : 'bg-perempuan'}">
                            ${item.jantina}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');

        searchInput.addEventListener('input', function() {
            const val = this.value.trim().toUpperCase();
            applyFilters();

            if (!val) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = allStudents.filter(s => s.nama.includes(val) || s.noMatrik.includes(val)).slice(0, 5);

            if (matches.length > 0) {
                suggestionsBox.innerHTML = matches.map(s => `
                    <div class="suggestion-item" onclick="selectSuggestion('${s.nama}')">
                        <strong>${s.nama}</strong> (${s.noMatrik})
                    </div>
                `).join('');
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        });

        window.selectSuggestion = function(nama) {
            searchInput.value = nama;
            suggestionsBox.style.display = 'none';
            applyFilters();
        };

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });

        loadStudents();
    </script>
</body>
</html>
